# EXAMPLE ONLY. Separate from your existing Nginx on port 18080.
# Intended as a standalone config for your existing Windows Nginx prefix.
# Proxies ONLY to the secure website at 127.0.0.1:3100.
daemon off;
master_process off;
worker_processes 1;
error_log stderr notice;
pid logs/nginx-api-shield.pid;
events { worker_connections 256; }
http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=shield_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=shield_api:10m rate=10r/s;
    server {
        listen 127.0.0.1:18180;
        server_name localhost;
        add_header X-Content-Type-Options "nosniff" always;
        location = /api/login {
            limit_req zone=shield_login burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:3100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/ {
            limit_req zone=shield_api burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:3100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://127.0.0.1:3100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
